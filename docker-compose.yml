# Runs the API and SQL Server 2022 locally.
#
#   cp .env.example .env
#   docker compose up --build
#
# Swagger UI: http://localhost:8080/swagger    Health: http://localhost:8080/health
#
# The API runs in the Development environment, so on startup it applies EF Core migrations, creates the admin
# from ADMIN_EMAIL / ADMIN_PASSWORD, and seeds demo customers and accounts.

name: banking-api

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: banking-api:local
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BankingDb: "Server=sqlserver,1433;Database=BankingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (see .env.example)}
      BootstrapAdmin__Email: ${ADMIN_EMAIL:-admin@example.com}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (see .env.example)}
      DemoData__Enabled: "true"
      DemoData__UserPassword: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env (see .env.example)}
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
